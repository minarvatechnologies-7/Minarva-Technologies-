name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # CI-only placeholder: Prisma validates the schema from the env var,
      # but these steps do not connect to a database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/minarva_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint application
        run: npm run lint
      - name: Build application
        run: npm run build
